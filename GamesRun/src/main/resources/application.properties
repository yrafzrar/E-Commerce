spring.application.name=GamesRun
server.port=8081

spring.datasource.url=jdbc:h2:file:./data/gamesrun;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Fotos dos anúncios ficam fora do código e permanecem após reiniciar/compilar.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
gamesrun.upload-dir=./uploads/anuncios
